[build]
  command = "pnpm --filter @taj-saas/owner build"
  publish = "apps/owner/.next"
  ignore = "git diff --quiet $NETLIFY_PREVIOUS_COMMIT $NETLIFY_COMMIT_REF -- apps/owner/ packages/ lib/ turbo.json package.json"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
