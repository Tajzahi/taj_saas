openapi: 3.0.3
info:
  title: ERP FnB Enterprise API
  version: 1.0.0
servers:
  - url: https://api.example.com/api/v1
paths:
  /auth/login:
    post:
      summary: Login user
      responses:
        '200':
          description: Login success
  /outlets:
    get:
      summary: List outlets
      responses:
        '200':
          description: Outlet list
    post:
      summary: Create outlet
      responses:
        '201':
          description: Outlet created
  /public/outlets/{outletId}/menus:
    get:
      summary: Public menu by outlet
      parameters:
        - in: path
          name: outletId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu list
  /customer/orders:
    post:
      summary: Create customer order
      responses:
        '201':
          description: Order created
  /orders:
    post:
      summary: Create POS order
      responses:
        '201':
          description: Order created
    get:
      summary: List orders
      responses:
        '200':
          description: Order list
  /orders/{id}/pay:
    post:
      summary: Pay order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment accepted
  /kitchen/orders:
    get:
      summary: List kitchen orders
      responses:
        '200':
          description: Kitchen orders
  /kitchen/orders/{id}/status:
    patch:
      summary: Update kitchen order status
      responses:
        '200':
          description: Status updated
  /shifts/open:
    post:
      summary: Open cashier shift
      responses:
        '201':
          description: Shift opened
  /shifts/{id}/close:
    post:
      summary: Close cashier shift
      responses:
        '200':
          description: Shift closed
  /recipes:
    get:
      summary: List recipes
      responses:
        '200':
          description: Recipe list
    post:
      summary: Create recipe
      responses:
        '201':
          description: Recipe created
  /stock-opnames:
    post:
      summary: Create stock opname
      responses:
        '201':
          description: Stock opname created
  /waste-records:
    post:
      summary: Create waste record
      responses:
        '201':
          description: Waste recorded
  /reports/sales-summary:
    get:
      summary: Sales summary report
      responses:
        '200':
          description: Sales summary
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
